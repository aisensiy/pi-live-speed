name: Publish to npm

# Publishes to npm via OIDC trusted publishing (no long-lived NPM_TOKEN) when a
# version tag (vX.Y.Z) is pushed.
#
# One-time setup on npmjs.com: @aisensiy/pi-live-speed -> Settings -> Trusted
# Publisher -> GitHub Actions, with:
#   Organization or user : aisensiy
#   Repository           : pi-live-speed
#   Workflow filename    : publish.yml   (filename only, case-sensitive)
#   Environment name     : (leave blank)
#   Allowed actions      : npm publish
# A freshly configured trusted publisher must complete its first successful
# publish within 48 hours, otherwise recreate it.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to an OIDC-capable version (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run checks (typecheck, tests, isolated load)
        run: npm run check

      - name: Verify tag matches package version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
          echo "Publishing $pkg_version from tag $GITHUB_REF_NAME"

      - name: Publish to npm (OIDC, no token)
        run: npm publish --access public
